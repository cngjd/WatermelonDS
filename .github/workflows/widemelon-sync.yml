name: WatermelonDS Wide sync

# Daily: rebase the WideMelon branches onto the latest SapphireRhodonite/WatermelonDS, build the release APK and
# publish it. On a rebase conflict or a failed build/test nothing is pushed and an issue is opened instead.
# Also opens an issue when manijose1919/widemelon-android has commits we haven't reviewed.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build and publish even if upstream has not changed'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: widemelon-sync
  cancel-in-progress: false

env:
  UPSTREAM_APP_URL: https://github.com/SapphireRhodonite/WatermelonDS.git
  UPSTREAM_APP_BRANCH: Develop
  UPSTREAM_LIB_URL: https://github.com/SapphireRhodonite/melonDS-android-lib.git
  WIDEMELON_ANDROID_URL: https://github.com/manijose1919/widemelon-android.git
  APK_PATH: app/build/outputs/apk/gitHubProd/release/app-gitHub-prod-release.apk

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: widescreen
          fetch-depth: 0
          submodules: recursive

      - name: Prepare git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C melonDS-android-lib fetch -q origin lib-widescreen

      - name: Rebase onto upstream WatermelonDS
        id: sync
        run: bash scripts/widemelon-sync.sh

      - uses: actions/setup-java@v4
        if: steps.sync.outputs.changed == 'true' || inputs.force_build
        with:
          java-version: '21'
          distribution: zulu
          cache: gradle

      - name: Setup Android SDK
        if: steps.sync.outputs.changed == 'true' || inputs.force_build
        # The runner image ships an SDK; install exactly what AppConfig/app/build.gradle.kts need
        run: |
          sdkmanager="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.13004108" "cmake;3.22.1" > /dev/null

      - name: Build and test
        if: steps.sync.outputs.changed == 'true' || inputs.force_build
        env:
          WIDE_KEYSTORE: ${{ secrets.WIDE_KEYSTORE }}
          WIDE_KEYSTORE_PASSWORD: ${{ secrets.WIDE_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$WIDE_KEYSTORE" ]]; then
            echo "::error::WIDE_KEYSTORE secret missing: APKs must always be signed with the same key"
            exit 1
          fi
          echo "$WIDE_KEYSTORE" | base64 -d > "$RUNNER_TEMP/wide.jks"
          {
            echo "MELONDS_KEYSTORE=$RUNNER_TEMP/wide.jks"
            echo "MELONDS_KEYSTORE_PASSWORD=$WIDE_KEYSTORE_PASSWORD"
            echo "MELONDS_KEY_ALIAS=melonds"
            echo "MELONDS_KEY_PASSWORD=$WIDE_KEYSTORE_PASSWORD"
          } >> local.properties
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleGitHubProdRelease :app:testGitHubProdReleaseUnitTest -PmelonAbis=arm64-v8a
          # The build regenerates Vulkan SPIR-V headers (as stock does); never commit them
          git -C melonDS-android-lib checkout -- src

      - name: Push rebased branches
        if: steps.sync.outputs.changed == 'true'
        run: |
          git -C melonDS-android-lib push --force origin lib-widescreen
          git push --force-with-lease origin widescreen

      - name: Publish release
        if: steps.sync.outputs.changed == 'true' || inputs.force_build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          upstream="${{ steps.sync.outputs.upstream }}"
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' buildSrc/src/main/kotlin/AppConfig.kt)
          tag="wide-$(date -u +%Y%m%d)-${upstream:0:8}"
          cp "$APK_PATH" "WatermelonDS-Wide-${version}-${upstream:0:8}-arm64.apk"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" "WatermelonDS-Wide-${version}-${upstream:0:8}-arm64.apk" \
            --target widescreen \
            --title "WatermelonDS Wide ${version} (upstream ${upstream:0:8})" \
            --notes "WideMelon widescreen build on top of SapphireRhodonite/WatermelonDS@${upstream}. Release build, arm64-v8a. Source: branch \`widescreen\` (submodule branch \`lib-widescreen\`)."

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Sync failed for upstream ${{ steps.sync.outputs.upstream }}"
          if gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number' | grep -q .; then
            exit 0
          fi
          gh issue create --title "$title" --body "The daily sync could not rebase, build or test against SapphireRhodonite/WatermelonDS@${{ steps.sync.outputs.upstream }}. Nothing was pushed or released.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  watch-widescreen-sources:
    # Widescreen sources are ported by hand: open an issue when they have commits we haven't reviewed
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: widemelon-android
            repo: manijose1919/widemelon-android
            reviewed: .github/widemelon-android-reviewed
            paths: melonDS-android-lib/src app/src/main
          - name: widemelon
            repo: pruefsumme/widemelon
            reviewed: .github/widemelon-reviewed
            # Only its widescreen code: the repo also merges melonDS and has a phone-bridge frontend
            paths: src/WideMelon.h src/GPU.cpp src/GPU3D.cpp src/GPU3D_OpenGL.cpp src/GPU_OpenGL.cpp src/OpenGL_shaders src/frontend/qt_sdl/WideMelonSetup.cpp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: widescreen
          sparse-checkout: .github

      - name: Check ${{ matrix.name }} for unreviewed commits
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ matrix.repo }}
          SOURCE_PATHS: ${{ matrix.paths }}
        run: |
          reviewed=$(tr -d '[:space:]' < "${{ matrix.reviewed }}")
          git init -q src && cd src
          git fetch -q "https://github.com/$SOURCE_REPO.git" HEAD
          head=$(git rev-parse FETCH_HEAD)
          git fetch -q "https://github.com/$SOURCE_REPO.git" "$reviewed" || true
          # shellcheck disable=SC2086
          if git cat-file -e "$reviewed^{commit}" 2>/dev/null; then
            log=$(git log --format='- %h %ad %s' --date=short "$reviewed..$head" -- $SOURCE_PATHS)
          else
            log=$(git log -20 --format='- %h %ad %s' --date=short "$head" -- $SOURCE_PATHS)
          fi
          if [[ -z "$log" ]]; then
            echo "$SOURCE_REPO: no new widescreen commits since ${reviewed:0:10}"
            exit 0
          fi
          latest=$(git log -1 --format=%h "$head" -- $SOURCE_PATHS)
          title="$SOURCE_REPO has new widescreen commits ($latest)"
          if gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[].number' | grep -q .; then
            exit 0
          fi
          files=$(git diff --stat "$reviewed" "$head" -- $SOURCE_PATHS 2>/dev/null | tail -40 || true)
          gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$SOURCE_REPO has commits touching its widescreen code since \`${reviewed:0:10}\`. They are not ported automatically: review them, port what's worth it, then update \`${{ matrix.reviewed }}\` to \`$head\`.

          Commits:
          $log

          Files:
          \`\`\`
          $files
          \`\`\`"
